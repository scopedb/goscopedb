[tools]
go = "1.24.13"
golangci-lint = "2.1.6"

[tasks.build]
description = "Build all packages"
run = "go build ./..."

[tasks.test]
description = "Run unit tests and benchmarks"
run = '''
packages="$(go list ./... | grep -v '/tests/integration$')"
go test -v -bench=. $packages
'''

[tasks.test-integration]
description = "Run tests against a ScopeDB endpoint"
run = "go test -v ./tests/integration"

[tasks.check-license]
description = "Check license headers"
run = "hawkeye check"

[tasks.fmt-license]
description = "Format license headers"
run = "hawkeye format"

[tasks.check-static]
description = "Run static analysis"
run = "CGO_ENABLED=0 golangci-lint run -v"

[tasks.fix-static]
description = "Apply static analysis fixes"
run = "CGO_ENABLED=0 golangci-lint run --fix -v"

[tasks.check-mod-tidy]
description = "Check Go module metadata"
run = "go mod tidy -diff"

[tasks.fix-mod-tidy]
description = "Update Go module metadata"
run = "go mod tidy"

[tasks.check]
description = "Run all checks"
depends = ["check-license", "check-mod-tidy", "check-static"]

[tasks.fix]
description = "Apply all automated fixes"
run = '''
mise run fmt-license
mise run fix-mod-tidy
mise run fix-static
'''
