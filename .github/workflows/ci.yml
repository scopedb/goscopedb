name: CI (Go SDK)
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Install Hawkeye
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/fast/hawkeye/releases/download/v7.0.0/hawkeye-installer.sh | sh
      - name: Check Go SDK
        run: mise run check

  test:
    name: Build and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Build Go SDK
        run: mise run build
      - name: Run unit tests
        timeout-minutes: 10
        run: mise run test

  required:
    name: Required
    runs-on: ubuntu-22.04
    if: ${{ always() }}
    needs:
      - check
      - test
    steps:
      - name: Guardian
        run: |
          check_result="${{ needs.check.result }}"
          test_result="${{ needs.test.result }}"

          if [[ "$test_result" != "success" ]]; then
            echo "The test job did not complete successfully: $test_result"
            exit 1
          fi

          if [[ "$check_result" != "success" ]]; then
            echo "The check job did not complete successfully: $check_result"
            exit 1
          fi
