name: CI (Go SDK)
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, build, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15, windows-2025 ]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Check Go SDK
        run: mise run check
      - name: Build Go SDK
        run: mise run build
      - name: Run unit tests with the race detector
        run: mise run test:race

  required:
    name: Required
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs: ci
    steps:
      - name: Guardian
        run: test "${{ needs.ci.result }}" = "success"
